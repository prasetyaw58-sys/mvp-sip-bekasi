name: Auto Scraper Regulasi

on:
  schedule:
    # Mengatur jadwal otomatis (berjalan setiap hari pukul 00:00 UTC)
    - cron: '0 0 * * *'
  # Memungkinkan Anda juga menjalankan skrip secara manual kapan saja lewat tombol
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: python scraper.py
